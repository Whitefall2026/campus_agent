name: Diagnose Intel HTTP startup
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Capture local HTTP startup stack
        shell: bash
        run: |
          python -u - <<'PY'
          import faulthandler, time, tempfile, os, socket
          faulthandler.enable()
          faulthandler.dump_traceback_later(10, repeat=True)
          with tempfile.TemporaryDirectory() as root:
              os.environ['RUC_AGENT_DATA_DIR'] = root
              start = time.monotonic()
              print('import-start', flush=True)
              from app.web.handlers import Handler
              print('import-done', time.monotonic()-start, flush=True)
              from http.server import ThreadingHTTPServer
              start = time.monotonic()
              print('HTTPServer-bind-start', flush=True)
              server = ThreadingHTTPServer(('127.0.0.1',0), Handler)
              print('HTTPServer-bind-done', time.monotonic()-start, flush=True)
              server.server_close()
              faulthandler.cancel_dump_traceback_later()
          PY
